const {useState,useEffect,useRef,useCallback}=React;
const C={ink:"#1C1C1C",bg:"#FAF9F7",white:"#FFFFFF",border:"#E8E5E0",accent:"#2D6A4F",accentL:"#E8F4EE",amber:"#C47D2E",muted:"#5A5A5A",soft:"#8A8A8A"};
const CHARS="!<>-_\\/[]{}=+*^?#ABCDEFabcdef0123";

function useInView(th=0.15){
  const ref=useRef(null);
  const[v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect();}},{threshold:th});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return[ref,v];
}

function FadeIn({children,delay=0,y=22,style={}}){
  const[ref,v]=useInView();
  return<div ref={ref} style={{opacity:v?1:0,transform:v?"none":`translateY(${y}px)`,transition:`opacity .6s ease ${delay}ms,transform .6s ease ${delay}ms`,...style}}>{children}</div>;
}

function ScrambleText({text,as:As="span",style={},className=""}){
  const[d,setD]=useState(text);
  const raf=useRef(null);
  const go=()=>{
    let f=0;
    const q=[...text].map(ch=>({to:ch,s:Math.floor(Math.random()*5),e:Math.floor(Math.random()*8)+5,c:""}));
    const tick=()=>{
      let out="",done=0;
      q.forEach(x=>{
        if(f>=x.e){done++;out+=x.to;}
        else if(f>=x.s){x.c=CHARS[Math.floor(Math.random()*CHARS.length)];out+=`<span style="color:#2D6A4F;font-style:italic;opacity:.8">${x.c}</span>`;}
        else out+=x.to;
      });
      setD(out);
      if(done<q.length)raf.current=requestAnimationFrame(()=>{f++;tick();});
      else setD(text);
    };
    cancelAnimationFrame(raf.current);tick();
  };
  const reset=()=>{cancelAnimationFrame(raf.current);setD(text);};
  return<As style={style} className={className} onMouseEnter={go} onMouseLeave={reset} dangerouslySetInnerHTML={{__html:d}}/>;
}

function TiltCard({children,style={},className=""}){
  const ref=useRef(null);
  return<div ref={ref} className={className}
    onMouseMove={e=>{const r=ref.current.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;ref.current.style.transform=`perspective(600px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateZ(4px)`;ref.current.style.transition="transform .05s";}}
    onMouseLeave={()=>{ref.current.style.transform="";ref.current.style.transition="transform .5s cubic-bezier(.34,1.56,.64,1)";}}
    style={style}>{children}</div>;
}

function GradText({children}){

function PCard({p,i}){
  const[h,setH]=useState(false);
  const[td,setTd]=useState(p.title);
  const raf=useRef(null);
  const sc=t=>{let f=0;const q=[...t].map(ch=>({to:ch,s:Math.floor(Math.random()*4),e:Math.floor(Math.random()*7)+4,c:""}));const tick=()=>{let out="",done=0;q.forEach(x=>{if(f>=x.e){done++;out+=x.to;}else if(f>=x.s){x.c=CHARS[Math.floor(Math.random()*CHARS.length)];out+=x.c;}else out+=x.to;});setTd(out);if(done<q.length)raf.current=requestAnimationFrame(()=>{f++;tick();});else setTd(t);};cancelAnimationFrame(raf.current);tick();};
  return(
    <FadeIn delay={i*80}>
      <article style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",display:"flex",flexDirection:"column",transition:"box-shadow .2s,transform .2s",boxShadow:h?"0 8px 32px rgba(0,0,0,.1)":"none",transform:h?"translateY(-4px)":"none"}}
        onMouseEnter={()=>{setH(true);sc(p.title);}} onMouseLeave={()=>{setH(false);setTd(p.title);cancelAnimationFrame(raf.current);}}>
        <div aria-hidden style={{height:120,background:p.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"3rem",borderBottom:`1px solid ${C.border}`,transition:"transform .3s",transform:h?"scale(1.05)":"scale(1)"}}>{p.em}</div>
        <div style={{padding:"1.35rem",flex:1,display:"flex",flexDirection:"column"}}>
          <p style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"1.5px",color:C.soft,marginBottom:".4rem"}}>{p.eye}</p>
          <h3 style={{fontSize:15,fontWeight:600,color:C.ink,marginBottom:".5rem",lineHeight:1.35}}>{td}</h3>
          <p style={{fontSize:13,color:C.muted,lineHeight:1.7,flex:1,marginBottom:"1rem"}}>{p.desc}</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:".3rem",marginBottom:"1rem"}}>
            {p.tags.map(t=><span key={t} style={{fontSize:11,fontWeight:500,padding:"3px 8px",borderRadius:5,background:C.bg,color:C.soft,border:`1px solid ${C.border}`}}>{t}</span>)}
          </div>
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,padding:"1rem 1.35rem"}}>
          <a href={p.gh} target="_blank" rel="noopener noreferrer" aria-label={`View ${p.title} on GitHub`} style={{fontSize:13,fontWeight:600,color:C.accent,display:"inline-flex",alignItems:"center",gap:".3rem",textDecoration:"none",transition:"gap .2s"}}
            onMouseEnter={e=>e.currentTarget.style.gap=".6rem"} onMouseLeave={e=>e.currentTarget.style.gap=".3rem"}>
            View on GitHub ↗
          </a>
        </div>
      </article>
    </FadeIn>
  );
}

function ScrollBar(){
  const[p,setP]=useState(0);
  useEffect(()=>{const h=()=>{const t=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight;setP(d?t/d*100:0);};window.addEventListener("scroll",h);return()=>window.removeEventListener("scroll",h);},[]);
  return<div aria-hidden role="presentation" style={{position:"fixed",top:0,left:0,height:3,zIndex:9998,width:`${p}%`,background:`linear-gradient(90deg,#2D6A4F,#C47D2E)`,transition:"width .1s linear",pointerEvents:"none"}}/>;
}
